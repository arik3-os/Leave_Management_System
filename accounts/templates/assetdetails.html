{% extends "base.html" %}

{% block content %}

<div class="min-h-screen bg-gray-100 py-10">

    <div class="max-w-4xl mx-auto bg-white shadow-xl rounded-xl p-8">

        <!-- Heading -->
        <div class="border-b pb-5 mb-8">
            <h2 class="text-3xl font-bold text-blue-700">
                Assign Employee Asset
            </h2>
            <p class="text-gray-500 mt-2">
                Allocate company assets to an employee.
            </p>
        </div>

        <form method="POST">
            {% csrf_token %}

            <!-- Employee Information -->
            <h3 class="text-xl font-semibold text-blue-700 mb-5">
                Employee Information
            </h3>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <div>
                    <label class="block mb-2 font-semibold text-gray-700">
                        Employee ID
                    </label>
                    <input type="text"
                           value="{{ employee.employee_id }}"
                           readonly
                           class="w-full rounded-lg border border-gray-300 bg-gray-100 px-4 py-3">
                </div>

                <div>
                    <label class="block mb-2 font-semibold text-gray-700">
                        Employee Name
                    </label>
                    <input type="text"
                           value="{{ employee.name }}"
                           readonly
                           class="w-full rounded-lg border border-gray-300 bg-gray-100 px-4 py-3">
                </div>

                <div>
                    <label class="block mb-2 font-semibold text-gray-700">
                        Department
                    </label>
                    <input type="text"
                           value="{{ employee.department }}"
                           readonly
                           class="w-full rounded-lg border border-gray-300 bg-gray-100 px-4 py-3">
                </div>

                <div>
                    <label class="block mb-2 font-semibold text-gray-700">
                        Designation
                    </label>
                    <input type="text"
                           value="{{ employee.designation }}"
                           readonly
                           class="w-full rounded-lg border border-gray-300 bg-gray-100 px-4 py-3">
                </div>

            </div>

            <!-- Asset Details -->

            <h3 class="text-xl font-semibold text-blue-700 mt-10 mb-5">
                Asset Information
            </h3>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <div>
                    <label class="block mb-2 font-semibold text-gray-700">
                        Asset Name
                    </label>
                    <input type="text"
                           name="asset_name"
                           placeholder="Laptop"
                           class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block mb-2 font-semibold text-gray-700">
                        Brand
                    </label>
                    <input type="text"
                           name="brand"
                           placeholder="HP"
                           class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block mb-2 font-semibold text-gray-700">
                        Model
                    </label>
                    <input type="text"
                           name="model"
                           placeholder="ProBook 440 G9"
                           class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block mb-2 font-semibold text-gray-700">
                        Serial Number
                    </label>
                    <input type="text"
                           name="serial_number"
                           placeholder="Enter Serial Number"
                           class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block mb-2 font-semibold text-gray-700">
                        Issue Date
                    </label>
                    <input type="date"
                           name="issue_date"
                           class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:border-blue-500">
                </div>

            </div>

            <!-- Buttons -->

            <div class="mt-10 flex justify-center gap-4">

                <button type="submit"
                        class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-lg">
                    Assign Asset
                </button>

                <a href="{% url 'employee_profiles' %}"
                   class="bg-gray-600 hover:bg-gray-700 text-white px-8 py-3 rounded-lg">
                    Back
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
