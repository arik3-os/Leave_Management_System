{% extends "base.html" %}

{% block content %}

<div class="flex items-center justify-center p-10 bg-gray-100">
    <div class="w-full max-w-4xl bg-white rounded-3xl shadow-lg p-8">

        <h2 class="text-3xl font-bold text-center text-blue-700 mb-8">
            Employee Details
        </h2>

        <form method="POST">
            {% csrf_token %}

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <!-- Full Name -->
                <div>
                    <label class="block mb-2 font-semibold text-gray-700">
                        Full Name
                    </label>
                    <input type="text" name="name"
                        class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:border-blue-500 focus:outline-none"
                        placeholder="Enter Full Name">
                </div>

                <!-- Email -->
                <div>
                    <label class="block mb-2 font-semibold text-gray-700">
                        Email Address
                    </label>
                    <input type="email" name="email"
                        class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:border-blue-500 focus:outline-none"
                        placeholder="Enter Email">
                </div>

                <!-- Phone -->
                <div>
                    <label class="block mb-2 font-semibold text-gray-700">
                        Phone Number
                    </label>
                    <input type="text" name="mobile"
                        class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:border-blue-500 focus:outline-none"
                        placeholder="Enter Phone Number">
                </div>

                <!-- Date of Birth -->
                <div>
                    <label class="block mb-2 font-semibold text-gray-700">
                        Date of Birth
                    </label>
                    <input type="date" name="dob"
                        class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:border-blue-500 focus:outline-none">
                </div>

                <!-- Joining Date -->
                <div>
                    <label class="block mb-2 font-semibold text-gray-700">
                        Joining Date
                    </label>
                    <input type="date" name="joining_date"
                        class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:border-blue-500 focus:outline-none">
                </div>

            </div>
                <!-- Designation -->
                  <div class="mt-6">
<div>
    <label class="block mb-2 font-semibold text-gray-700">
        Designation
    </label>
    <input type="text" name="designation"
        class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:border-blue-500 focus:outline-none"
        placeholder="Enter Designation">
</div>

                <!-- Department -->
                  <div class="mt-6">
<div>
    <label class="block mb-2 font-semibold text-gray-700">
        Department
    </label>
    <select name="department"
        class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:border-blue-500 focus:outline-none">
        <option value="">Select Department</option>
        <option value="Human Resources">Human Resources</option>
        <option value="Software Development">Software Development</option>
        <option value="Testing">Testing</option>
        <option value="Finance">Finance</option>
        <option value="Sales">Sales</option>
        <option value="Marketing">Marketing</option>
        <option value="Support">Support</option>
        <option value="Administration">Administration</option>
    </select>
</div>
            <!-- Address -->
            <div class="mt-6">
                <label class="block mb-2 font-semibold text-gray-700">
                    Address
                </label>
                <textarea name="address" rows="3"
                    class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:border-blue-500 focus:outline-none"
                    placeholder="Enter Address"></textarea>
            </div>

            <!-- Pin & State -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">

                <div>
                    <label class="block mb-2 font-semibold text-gray-700">
                        Pin Code
                    </label>
                    <input type="text" name="pincode"
                        class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:border-blue-500 focus:outline-none"
                        placeholder="Enter Pin Code">
                </div>

                <div>
                    <label class="block mb-2 font-semibold text-gray-700">
                        State
                    </label>
                    <input type="text" name="state"
                        class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:border-blue-500 focus:outline-none"
                        placeholder="Enter State">
                </div>

            </div>

            <h3 class="text-2xl font-bold text-blue-700 mt-10 mb-6 border-b pb-2">
                Bank Details
            </h3>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <!-- Bank Name -->
                <div>
                    <label class="block mb-2 font-semibold text-gray-700">
                        Bank Name
                    </label>
                    <input type="text" name="bank_name"
                        class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:border-blue-500 focus:outline-none"
                        placeholder="Enter Bank Name">
                </div>

                <!-- Account Number -->
                <div>
                    <label class="block mb-2 font-semibold text-gray-700">
                        Bank Account Number
                    </label>
                    <input type="text" name="account_number"
                        class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:border-blue-500 focus:outline-none"
                        placeholder="Enter Account Number">
                </div>

                <!-- IFSC -->
                <div class="md:col-span-2">
                    <label class="block mb-2 font-semibold text-gray-700">
                        IFSC Code
                    </label>
                    <input type="text" name="ifsc"
                        class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:border-blue-500 focus:outline-none"
                        placeholder="Enter IFSC Code">
                </div>

            </div>

            <div class="mt-8">
                <button type="submit"
                    class="w-full rounded-3xl-lg bg-blue-600 py-3 text-lg font-semibold text-white hover:bg-blue-700 transition">
                    Save Employee Details
                </button>
            </div>

        </form>

    </div>
</div>


{% endblock content %}
