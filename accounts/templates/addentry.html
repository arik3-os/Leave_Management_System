{% extends 'base.html' %}

{% block content %}

<div class="min-h-screen bg-gradient-to-r from-blue-100 via-white to-blue-200 flex items-center justify-center py-10">

    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl p-8">

        <h1 class="text-3xl font-bold text-center text-blue-700 mb-8">
            Add Your Entry
        </h1>

        <form method="POST">
            {% csrf_token %}

            <!-- Full Name -->
            <div class="mb-5">
                <label class="block text-gray-700 font-semibold mb-2">
                    Full Name
                </label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your name"
                    class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-blue-400 outline-none">
            </div>

            <!-- Email -->
            <div class="mb-5">
                <label class="block text-gray-700 font-semibold mb-2">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email e.g.: username@gmail.com"
                    class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-blue-400 outline-none">
            </div>

            <!-- Date & Project -->
            <div class="grid md:grid-cols-2 gap-5 mb-5">

                <div>
                    <label class="block text-gray-700 font-semibold mb-2">
                        Date
                    </label>

                    <input
                        type="date"
                        name="date"
                        class="w-full border rounded-lg p-3">
                </div>

                <div>
                    <label class="block text-gray-700 font-semibold mb-2">
                        Project
                    </label>

                    <select
                        name="project"
                        class="w-full border rounded-lg p-3">

                        <option>Select Project</option>
                        <option>Leave Management VERSION 1.0</option>
                        <option>Attendance System VERSION 2.0</option>
                        <option>Midnight Investigator Version 1.0</option>
                        <option>HR Portal</option>
                        <option>AI Chatbot Eclipse AI Version 1.0</option>

                    </select>
                </div>

            </div>

            <!-- Check In & Check Out -->
            <div class="grid md:grid-cols-2 gap-5 mb-5">

                <div>
                    <label class="block text-gray-700 font-semibold mb-2">
                        Check In
                    </label>

                    <input
                        type="time"
                        name="checkin"
                        class="w-full border rounded-lg p-3">
                </div>

                <div>
                    <label class="block text-gray-700 font-semibold mb-2">
                        Check Out
                    </label>

                    <input
                        type="time"
                        name="checkout"
                        class="w-full border rounded-lg p-3">
                </div>

            </div>

            <!-- Task -->
            <div class="mb-5">
                <label class="block text-gray-700 font-semibold mb-2">
                    Task
                </label>

                <input
                    type="text"
                    name="task"
                    placeholder="Example: Dashboard UI Design"
                    class="w-full border rounded-lg p-3">
            </div>

            <!-- Description -->
            <div class="mb-6">
                <label class="block text-gray-700 font-semibold mb-2">
                    Description
                </label>

                <textarea
                    name="description"
                    rows="5"
                    placeholder="Describe the work completed..."
                    class="w-full border rounded-lg p-3"></textarea>
            </div>

            <!-- Buttons -->
            <div class="flex justify-end gap-4">
                
<div class="flex justify-end gap-4 pt-8 border-t border-gray-200">
    
    <!-- Cancel Button -->
    <a href="{% url 'timesheet' %}" 
       class="bg-gray-500 hover:bg-gray-600 text-white px-6 py-3 rounded-2xl font-medium transition-all active:scale-95">
        Cancel
    </a>

    <!-- Save Button -->
    <button 
        type="submit"
        class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-2xl font-medium transition-all active:scale-95 flex items-center gap-2">
        <span>Save Entry</span>
    </button>

</div>

            </div>

        </form>

    </div>

</div>

{% endblock %}
