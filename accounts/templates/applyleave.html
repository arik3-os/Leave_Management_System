{% extends 'base.html' %}

{% block content %}

<div class="min-h-screen bg-gradient-to-r from-blue-700 to-blue-200 flex items-center justify-center p-6">


    <div class="w-full max-w-xl bg-white rounded-xl shadow-lg p-8">


        <h2 class="text-3xl font-bold text-center text-blue-700 mb-8">
            Leave Application Form
        </h2>



        <form method="POST">

            {% csrf_token %}


            <div class="mb-5">

                <label class="mb-3 block text-base font-medium text-gray-800">
                    Full Name
                </label>

                <input 
                type="text"
                name="name"
                placeholder="Enter your full name"
                class="w-full rounded-md border border-gray-300 bg-white py-3 px-5 text-gray-700 outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-200">

            </div>



            <div class="mb-5">

                <label class="mb-3 block text-base font-medium text-gray-800">
                    Email Address
                </label>

                <input 
                type="email"
                name="email"
                placeholder="Enter your email address (e.g.: you@example.com)"
                class="w-full rounded-md border border-gray-300 bg-white py-3 px-5 text-gray-700 outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-200">

            </div>

<div class="my-6">

    <label class="mb-3 block text-base font-medium text-gray-800">
        Leave Type
    </label>


    <select 
    name="leave_type" 
    id="leave_type"
    class="block w-full rounded-md border border-slate-300 bg-white px-3 py-4 font-semibold text-gray-500 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500 sm:text-sm">


        <option selected disabled>
            Please Select Leave Type
        </option>

        <option value="Casual Leave">
            Casual Leave
        </option>

        <option value="Sick Leave">
            Sick Leave
        </option>
                <option value="Maternity Leave">
            Maternity Leave
        </option>
                <option value="Paternity Leave">
            Paternity Leave
        </option>
        </option>
                <option value="Bereavement Leave">
            Bereavement Leave
        </option>
        </option>
                <option value="Emergency Leave">
            Emergency Leave
        </option>
        <option value="Paid Leave">
            Paid Leave
        </option>


    </select>

</div>


            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">


                <div>

                    <label class="mb-3 block text-base font-medium text-gray-800">
                        From Date
                    </label>

                    <input 
                    type="date"
                    name="from_date"
                    class="w-full rounded-md border border-gray-300 py-3 px-5 focus:border-blue-600">

                </div>



                <div>

                    <label class="mb-3 block text-base font-medium text-gray-800">
                        To Date
                    </label>

                    <input 
                    type="date"
                    name="to_date"
                    class="w-full rounded-md border border-gray-300 py-3 px-5 focus:border-blue-600">

                </div>


            </div>




            <div class="mt-5">

                <label class="mb-3 block text-base font-medium text-gray-800">
                    Leave Reason
                </label>


                <textarea
                name="reason"
                rows="5"
                placeholder="Reason for leave"
                class="w-full rounded-md border border-gray-300 p-4 text-gray-700 outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-200"></textarea>


            </div>




            <button
            type="submit"
            class="mt-8 w-full rounded-md bg-blue-600 py-3 px-8 text-center text-base font-semibold text-white hover:bg-blue-700">

                Submit Leave

            </button>



        </form>


    </div>


</div>


{% endblock content %}
